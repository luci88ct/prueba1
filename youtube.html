<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>jairobiix | YouTube</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/png" href="favicon.jpeg" />
  <link rel="preconnect" href="https://www.youtube-nocookie.com" />
  <link rel="preconnect" href="https://i.ytimg.com" />
  <link rel="preconnect" href="https://www.youtube.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Orbitron:wght@400;700&display=swap" rel="stylesheet" />
</head>
<body>
  <nav class="navbar">
    <ul class="nav-links">
      <li><a href="index.html">Inicio</a></li>
      <li><a href="sobre-mi.html">Sobre mí</a></li>
      <li><a href="youtube.html" class="active">YouTube</a></li>
      <li><a href="contacto.html">Contacto</a></li>
    </ul>
  </nav>

  <main class="page youtube">
    <div class="youtube-header">
      <h2>YouTube</h2>
      <p>Aquí se actualizarán mis vídeos de Youtube 😎</p>
    </div>

    <section id="youtube-feed" class="video-feed">
      <div class="loading">Cargando últimos vídeos...</div>
    </section>
  </main>

  <footer>
    <p>2026 jairobiix | Creador de Contenido de Roblox</p>
  </footer>
  <script>
    const RSS_URL = 'https://www.youtube.com/feeds/videos.xml?channel_id=UUSfMEzJX9i4-3Xl6KFv3DAA';
    const feed = document.getElementById('youtube-feed');

    function setMessage(text) {
      feed.innerHTML = `<div class="empty-state">${text}</div>`;
    }

    async function loadFeed() {
      try {
        const res = await fetch(RSS_URL);
        if (!res.ok) throw new Error('RSS no accesible');
        const xmlText = await res.text();
        const parser = new DOMParser();
        const xml = parser.parseFromString(xmlText, 'application/xml');
        const entries = [...xml.querySelectorAll('entry')].slice(0, 3);

        if (!entries.length) {
          setMessage('Todavía no hay vídeos publicados.');
          return;
        }

        feed.innerHTML = entries.map(entry => {
          const title = entry.querySelector('title')?.textContent || 'Nuevo vídeo';
          const link = entry.querySelector('link')?.getAttribute('href') || '#';
          const idMatch = link.match(/v=([^&]+)/);
          const vid = idMatch ? idMatch[1] : '';
          const thumb = vid ? `https://i.ytimg.com/vi/${vid}/hqdefault.jpg` : '';
          const author = entry.querySelector('author > name')?.textContent || 'jairobiix';

          return `
            <article class="video-card">
              <a href="${link}" target="_blank" rel="noopener noreferrer">
                <img class="video-thumb" src="${thumb}" alt="${title}">
                <div class="video-body">
                  <h3>${title}</h3>
                  <p>${author}</p>
                </div>
              </a>
            </article>
          `;
        }).join('');
      } catch (e) {
        setMessage('No se pudo cargar el RSS. Si estás probando en local, puede que el navegador bloquee la petición.');
      }
    }

    loadFeed();
  </script>
</body>
</html>
